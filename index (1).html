<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

<body>

  <script type="text/babel">
    function HomeFeed({ setScreen, setCommentOpen, mockFeed, setMockFeed }) {
      const handleLike = (index) => {
        setMockFeed((prev) =>
          prev.map((item, i) =>
            i === index ? { ...item, liked: !item.liked, likes: item.liked ? item.likes - 1 : item.likes + 1 } : item
          )

      };

      return (
        <div className="flex flex-col h-screen bg-white">
          {/* Top Bar */}
          <div className="bg-blue-600 text-white p-4 flex justify-between items-center shadow">
            <h1 className="text-2xl font-bold">Loop</h1>
            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" onClick={() => setScreen('camera')}>
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
            </svg>
          </div>
          {/* Feed */}
          <div className="flex-1 overflow-y-auto">
            {mockFeed.map((item, index) => (
              <div key={index} className="bg-white mb-2 p-4">

                  <button

                    <svg className="w-5 h-5" fill={item.liked ? 'currentColor' : 'none'} stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                    </svg>
                    <span>{item.likes}</span>
                  </button>
                  <button onClick={() => setCommentOpen(true)} className="flex items-center space-x-1 text-gray-600">
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9- swipeup to see comments

    function CameraScreen({ setScreen, setMockFeed }) {
      const [recording, setRecording] = React.useState(false);
      const [preview, setPreview] = React.useState(false);

      const handleRecord = () => {
        setRecording(true);
        setTimeout(() => {
          setRecording(false);
          setPreview(true);

      };

      const handlePost = () => {
        setMockFeed((prev) => [...prev, { liked: false, likes: 0 }]);
        setPreview(false);
        setScreen('home');
      };

      return (

            </button>

          {/* Camera Preview */}

          {/* Record/Post */}

                className={`w-16 h-16 ${recording ? 'bg-blue-400' : 'bg-blue-600'} rounded-full border-4 border-white mx-auto block`}
                disabled={recording}

              <div className="bg-gray-800 p-4">

                  <div className="h-2 bg-blue-600 w-1/2 rounded"></div>
                </div>
                <button onClick={handlePost} className="mt-2 w-full bg-blue-600 text-white py-2 rounded">Post</button>
              </div>
            )}
          </div>
        </div>
      );
    }

    function Profile({ setScreen }) {
